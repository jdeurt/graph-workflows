name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install mypy==2.4.0
      - run: python -m mypy --strict skills/graph-workflows/scripts/workflow.py tests/test_workflow.py
      - run: python -m unittest discover -s tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Verify Claude Code and Codex installation
        run: |
          install_test=$(mktemp -d)
          cd "$install_test"
          npx --yes skills add "$GITHUB_WORKSPACE" --skill graph-workflows --agent claude-code codex --yes --copy
          test -f .claude/skills/graph-workflows/SKILL.md
          test -f .agents/skills/graph-workflows/SKILL.md
          test -f .agents/skills/graph-workflows/scripts/workflow.py
          test -f .agents/skills/graph-workflows/references/standard.md
        env:
          DISABLE_TELEMETRY: "1"
